[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nerux"
version = "0.1.0"
description = "A lightweight deep learning framework built with NumPy"
#readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

authors = [
    { name ="RAKIBUL HOQUE", email= "mdefas221@gmail.com" }
]

dependencies = [
    "numpy>=1.24"
]

keywords = [
    "deep-learning",
    "machine-learning",
    "autograd",
    "neural-network",
    "numpy"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[tool.setuptools]
packages = ["nerux"]

[tool.setuptools.package-data]
"nerux" = ["py.typed"]